name: RedirectProof
description: Detect redirect loops, duplicates, and shadowed rules
inputs:
  path:
    description: Project root or redirect file
    default: .
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - shell: bash
      run: redirectproof "${{ inputs.path }}"
