[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redirectproof"
version = "0.1.0"
description = "Detect redirect loops, duplicates, and shadowed web rules before deploy"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Eric Z" }]
keywords = ["redirects", "netlify", "vercel", "web", "ci"]

[project.scripts]
redirectproof = "redirectproof.cli:main"

[project.urls]
Homepage = "https://github.com/ericz218/redirectproof"
Issues = "https://github.com/ericz218/redirectproof/issues"

[tool.setuptools.packages.find]
where = ["src"]
